services:

  app:
    build: 
      context: .
      target: production
    container_name: api-registry
    ports:
      - "9878:9878"      
    volumes:
      # - .:/app                       # Map local code to container
      # - /app/node_modules            # Anonymous volume to protect container's node_modules
      - ./logs:/app/logs
    env_file:
      - ./.env
    depends_on:
      - postgres-db_api-registry
    networks:
      - pg-net
    
  postgres-db_api-registry:
    image: postgres:16-alpine
    restart: always
    env_file:
      - ./.env
    ports:
      - "5489:5432"
    volumes:
      - ./api-registry_db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pg-net

networks:
  pg-net:
    external: true
    name: shared-crud-api-network
    # driver: bridge